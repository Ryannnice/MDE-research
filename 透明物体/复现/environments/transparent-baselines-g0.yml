name: transparent-baselines-gpu
channels:
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      # PyPI remains the primary source for geometry/data dependencies; the
      # PyTorch index supplies the CUDA wheel when this file is used directly.
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.8.0
      - torchvision==0.23.0
      - numpy==1.26.4
      - scipy==1.15.3
      - Pillow==12.2.0
      - opencv-python==4.10.0.84
      - open3d==0.19.0
      - OpenEXR==3.3.3
      - Imath==0.0.2
      - pyyaml==6.0.2
      - tqdm==4.67.1
      - einops==0.8.1
      - timm==1.0.27
      - gdown==5.2.0
      - datasets==5.0.0
      - requests==2.32.5
      - pandas==2.3.1
      - matplotlib==3.10.5
      - monai==1.5.1
      - trimesh==4.7.4
      - pybullet==3.2.7
      - coacd==1.0.6
      - omegaconf==2.3.0
      - numba==0.61.2
      - scikit-image==0.25.2
      - wandb==0.20.1
