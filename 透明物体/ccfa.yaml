claims:
  - id: "H1"
    text: "Single completed depth, generic coarse shape, or untyped multi-layer geometry systematically loses at least one grasp-critical shell property on hollow transparent objects, and the loss is associated with planning or execution failures."
    status: "needs_evidence"
  - id: "H2"
    text: "Under matched inputs and budgets, semantic ordered interfaces with shell-topology constraints improve outer/inner surface, rim, thickness, and cavity reconstruction over single-depth, fixed-two-layer, and untyped K-layer alternatives."
    status: "needs_evidence"
  - id: "H3"
    text: "With the grasp planner, gripper, and candidate budget fixed, LayeredShellGeometry reduces shell-induced grasp failures and improves safe grasp performance."
    status: "needs_evidence"
  - id: "S1-support"
    text: "Single-depth baselines expose a measurable representational limitation under the LayeredDepth multi-layer protocol; evidence from the DPT Base fallback must not be mislabeled as Depth4ToM-FT evidence."
    status: "supported_by_p0_base_fallback"
