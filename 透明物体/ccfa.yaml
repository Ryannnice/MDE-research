decisions:
  - id: "D1"
    text: "Do not claim that transparent tableware grasping or multi-layer transparent depth is blank."
    status: "accepted"
  - id: "D2"
    text: "Use LayeredShellGeometry; retire ShellGraspPack to avoid collision with ShellGrasp-Net."
    status: "accepted"
  - id: "D3"
    text: "Do not implement the full proposed model before G0 establishes both reliable shell ground truth and grasp-relevant baseline failures."
    status: "accepted"
  - id: "D4"
    text: "Superseded Layer-Aware ToM v3-v5, Thin-Shell v1, and legacy idea cards were removed after their useful content was consolidated into the canonical idea and experiment documents."
    status: "accepted"
  - id: "D5"
    text: "Because the released Depth4ToM fine-tuned checkpoint is unavailable, use official DPT-Large and MiDaS v2.1 Base checkpoints for P0 diagnostics, and never label those results as Depth4ToM fine-tuned results."
    status: "accepted"
